<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Helvetica, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  </defs>
  <!-- Host -->
  <rect x="20" y="30" width="400" height="340" rx="12" fill="#eef4ff" stroke="#3a6ea5" stroke-width="2"/>
  <text x="40" y="58" font-size="16" font-weight="bold" fill="#1f3f66">MCP Host — host.py (OpenAI Agents SDK)</text>
  <rect x="45" y="80" width="150" height="60" rx="8" fill="#fff" stroke="#3a6ea5"/>
  <text x="120" y="106" text-anchor="middle" font-weight="bold">User (terminal)</text>
  <text x="120" y="125" text-anchor="middle" font-size="12">approves writes</text>
  <rect x="245" y="80" width="150" height="60" rx="8" fill="#fff" stroke="#3a6ea5"/>
  <text x="320" y="106" text-anchor="middle" font-weight="bold">Agent (LLM)</text>
  <text x="320" y="125" text-anchor="middle" font-size="12">picks the tool</text>
  <rect x="45" y="175" width="350" height="80" rx="8" fill="#fff8e6" stroke="#b07d12"/>
  <text x="220" y="198" text-anchor="middle" font-weight="bold">Host guards</text>
  <text x="220" y="218" text-anchor="middle" font-size="12">allow-list of 3 tools · sha256 manifest pin</text>
  <text x="220" y="236" text-anchor="middle" font-size="12">approval for writes · input/output injection guardrails</text>
  <rect x="45" y="285" width="350" height="60" rx="8" fill="#fff" stroke="#3a6ea5"/>
  <text x="220" y="311" text-anchor="middle" font-weight="bold">MCP Client — MCPServerStdio</text>
  <text x="220" y="330" text-anchor="middle" font-size="12">1:1 session · sets STUDYSPOT_USER (identity)</text>
  <!-- Server -->
  <rect x="480" y="30" width="400" height="340" rx="12" fill="#eefaf0" stroke="#2f8a4a" stroke-width="2"/>
  <text x="500" y="58" font-size="16" font-weight="bold" fill="#1d5a30">MCP Server — server.py (FastMCP)</text>
  <rect x="505" y="80" width="170" height="54" rx="8" fill="#fff" stroke="#2f8a4a"/>
  <text x="590" y="102" text-anchor="middle" font-weight="bold">search_rooms</text>
  <text x="590" y="121" text-anchor="middle" font-size="12">Data · read-only</text>
  <rect x="690" y="80" width="170" height="54" rx="8" fill="#fff" stroke="#2f8a4a"/>
  <text x="775" y="102" text-anchor="middle" font-weight="bold">book_room</text>
  <text x="775" y="121" text-anchor="middle" font-size="12">Action · one booking</text>
  <rect x="505" y="150" width="355" height="54" rx="8" fill="#fff" stroke="#2f8a4a"/>
  <text x="682" y="172" text-anchor="middle" font-weight="bold">plan_study_session</text>
  <text x="682" y="191" text-anchor="middle" font-size="12">Orchestration · calls both: search window → book best → retry</text>
  <rect x="505" y="220" width="355" height="40" rx="8" fill="#fff" stroke="#2f8a4a" stroke-dasharray="4 3"/>
  <text x="682" y="245" text-anchor="middle" font-size="12">Resources: rooms · rooms/{id} · bookings/{id} · policies</text>
  <rect x="505" y="285" width="355" height="60" rx="8" fill="#f4f4f4" stroke="#777"/>
  <text x="682" y="309" text-anchor="middle" font-weight="bold">service.py → SQLite</text>
  <text x="682" y="328" text-anchor="middle" font-size="12">parameterised SQL · atomic booking · typed errors</text>
  <!-- arrows -->
  <line x1="195" y1="110" x2="243" y2="110" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="320" y1="140" x2="320" y2="173" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="220" y1="255" x2="220" y2="283" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="395" y1="305" x2="478" y2="305" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="480" y1="325" x2="397" y2="325" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="437" y="296" text-anchor="middle" font-size="11" fill="#444">JSON-RPC</text>
  <text x="437" y="342" text-anchor="middle" font-size="11" fill="#444">stdio</text>
  <line x1="590" y1="150" x2="590" y2="136" stroke="#2f8a4a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="775" y1="150" x2="775" y2="136" stroke="#2f8a4a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="682" y1="260" x2="682" y2="283" stroke="#2f8a4a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="690" y="276" font-size="11" fill="#2f8a4a">calls</text>
</svg>
