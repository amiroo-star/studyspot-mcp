[project]
name = "studyspot-mcp"
version = "1.0.0"
description = "MCP toolkit (Data, Action, Orchestration tools) for booking study rooms, with an OpenAI Agents SDK host"
requires-python = ">=3.10"
dependencies = ["fastmcp>=4.1,<5", "openai-agents>=0.24,<0.25", "pydantic>=2.7", "tzdata>=2024.1"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
studyspot-server = "studyspot.server:main"

[tool.setuptools]
packages = ["studyspot"]

[tool.setuptools.package-data]
studyspot = ["tool_manifest.lock.json"]
